name: Refresh profile animations

on:
  schedule:
    # 00:15 Asia/Kolkata (18:45 UTC), once per day
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      GITHUB_USERNAME: anuragdevcode
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional classic PAT with read:user to include private contribution counts.
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --upgrade pip pillow

      - name: Generate contribution, seasonal and terminal animations
        run: python scripts/generate_profile.py

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.gif
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
          else
            git commit -m "chore: refresh profile animations"
            git push
          fi
