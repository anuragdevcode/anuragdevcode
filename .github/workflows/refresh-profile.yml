name: Refresh profile animations

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours (UTC); GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile.py"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate scene (live weather + real contributions)
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional; see SETUP.md
        run: python scripts/generate_profile.py

      - name: Commit only if something visible changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/scene.json
          if git diff --cached --quiet; then
            echo "Scene unchanged. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile scene"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
